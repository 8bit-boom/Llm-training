name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"        # nightly: only the end-to-end job (below) runs
jobs:
  core:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Clippy, correctness lints only (Linux)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --no-deps -- -A clippy::all -D clippy::correctness -D clippy::suspicious
      - run: cargo test --workspace --no-fail-fast
      - name: Window pages (Linux)
        if: runner.os == 'Linux'
        run: node --test ui/smoke/*.test.mjs
      - run: cargo build -p nd-lore-forge
      - name: Install script, prerequisites check (Linux)
        if: runner.os == 'Linux'
        run: ./install.sh --check
      - name: Install script, full run from a clone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Check
          ./install.ps1
          if (-not (Test-Path target/release/nd-lore-forge.exe)) { throw "program not built" }
          if (-not (Test-Path tools/uv.exe)) { throw "uv not fetched" }
      - name: Batch files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # install.bat hands over to install.ps1 and keeps its exit code; "< NUL" answers its final "pause"
          cmd /c "install.bat -Check < NUL"
          if ($LASTEXITCODE -ne 0) { throw "install.bat -Check failed ($LASTEXITCODE)" }
          if (-not (Test-Path run.bat)) { throw "run.bat missing" }
  worker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-ci.txt
      - run: pip install -r worker/requirements-ci.txt
      # only the errors that are always bugs (syntax, undefined names, bad format strings); no style rules
      - run: ruff check --isolated --select E9,F63,F7,F82 worker/ndforge_worker
      - run: cd worker && python -m pytest -q -n auto --durations=25 tests
  # The program's own steps on a tiny REAL model, on a CPU (crates/ndforge-core/tests/e2e.rs, #[ignore]d): inspect, measure, try, cut, heal, thinking check. Not on pull requests: it runs
  # on pushes to main, nightly, by hand, and on a push whose commit message says [e2e] (to try a change before it is merged).
  e2e-cpu:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[e2e]')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-ci.txt
      - name: Python with CPU PyTorch and the worker's libraries
        run: |
          python -m venv "$RUNNER_TEMP/e2e-venv"
          "$RUNNER_TEMP/e2e-venv/bin/pip" install -r worker/requirements-ci.txt
      - name: The end-to-end test
        env:
          NDFORGE_E2E_PYTHON: ${{ runner.temp }}/e2e-venv/bin/python
        run: cargo test -p ndforge-core --test e2e -- --ignored --nocapture
