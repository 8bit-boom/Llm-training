# Builds the installers when a tag like v0.1.0 is pushed (or by hand: then nothing is published, a dry run) and attaches them, SHA256SUMS.txt and the list of changes to the release.
# NOT YET RUN: the first run is the first build of the installers.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - run: cargo install tauri-cli --version "^2" --locked
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/ND-Lore-Forge-*" }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
        shell: pwsh
      # Signing only when a certificate is stored as the secrets WINDOWS_CERT_PFX (base64 of the .pfx) and WINDOWS_CERT_PASSWORD; without them the installer stays unsigned and the notes say so.
      - name: Sign the installer
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX -or -not $env:CERT_PASSWORD) { "unsigned" | Set-Content dist/UNSIGNED.txt; Write-Host "No certificate: the installer is not signed."; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem dist/ND-Lore-Forge-Setup-*.exe | ForEach-Object { & $tool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
          Remove-Item cert.pfx
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/ND-Lore-Forge-Setup-*.exe\ndist/UNSIGNED.txt" }
  # SHA256SUMS.txt and the list of changes since the previous tag; a run started by hand (a dry run) stops here and shows them in its summary
  notes:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Checksums and changes
        run: |
          set -eu
          mkdir -p out
          (cd artifacts && find . -type f ! -name UNSIGNED.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./[^/]*/#  #') > out/SHA256SUMS.txt
          prev=$(git tag --sort=-v:refname | grep -vx "${GITHUB_REF_NAME:-}" | head -1 || true)
          range=${prev:+$prev..}HEAD
          { echo "## Changes${prev:+ since $prev}"; echo; git log --pretty='- %s' $range | head -200; echo;
            if [ -f artifacts/windows/UNSIGNED.txt ]; then echo "The Windows installer is **not signed** (no certificate is set up yet): Windows may warn when you start it. Compare it with SHA256SUMS.txt."; fi;
            echo; echo "SHA256 of the files: see SHA256SUMS.txt."; } > out/NOTES.md
          { cat out/NOTES.md; echo; echo '```'; cat out/SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: notes, path: out }
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/**
            artifacts/windows/ND-Lore-Forge-Setup-*.exe
            artifacts/notes/SHA256SUMS.txt
          body_path: artifacts/notes/NOTES.md
