# Builds the worker image (Dockerfile.worker) and publishes it. NOT YET RUN: the first run is the first build of this image.
name: Worker image
on:
  workflow_dispatch:
  push:
    tags: ["worker-v*"]
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nd-lore-forge-worker:latest
