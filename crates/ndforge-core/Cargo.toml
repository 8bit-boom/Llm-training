[package]
name = "ndforge-core"
version.workspace = true
edition.workspace = true
description = "ND Lore Forge core: training bundles, projects, settings, help (no GUI dependencies)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
dirs = "5"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
regex = "1"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
tiny_http = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Power", "Win32_System_Registry", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile = "3"
