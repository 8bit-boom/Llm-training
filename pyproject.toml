[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ndforge"
version = "0.1.0"
description = "ND Lore Forge: fine-tune small LLMs on the lore and mechanics of an nd-world world"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "platformdirs>=4",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5"]

[project.scripts]
ndforge = "ndforge.app:main"

[project.gui-scripts]
ndforge-gui = "ndforge.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ndforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
