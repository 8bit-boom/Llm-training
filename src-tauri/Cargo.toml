[package]
name = "nd-lore-forge"
version.workspace = true
edition.workspace = true
description = "ND Lore Forge: fine-tune small LLMs on the lore and mechanics of an nd-world world"

[lib]
name = "nd_lore_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
ndforge-core = { path = "../crates/ndforge-core" }

[features]
# Embeds the window's files in the program. `cargo tauri build` turns it on by itself; a plain `cargo build --release` needs `--features custom-protocol`
# (without it the program looks for a development server and shows nothing).
custom-protocol = ["tauri/custom-protocol"]
