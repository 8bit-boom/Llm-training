<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ND Lore Forge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <strong class="brand">ND Lore Forge</strong>
    <span class="spacer"></span>
    <label class="toggle" title="Dark colours, easier on the eyes at night. Until you choose, the system setting is followed."><input type="checkbox" id="night"> 🌙 Night mode</label>
    <label class="toggle" title="Show every setting, not only the important ones"><input type="checkbox" id="expert"> Expert mode</label>
    <label class="toggle" title="Show or hide the instructions on the right"><input type="checkbox" id="helptoggle"> Help panel</label>
  </header>
  <div id="stall" class="warn stall" role="status" aria-live="polite" hidden></div>
  <div class="layout" id="layout">
    <nav id="steps" class="steps" aria-label="Steps"></nav>
    <main id="page" class="page"></main>
    <aside id="help" class="help" aria-label="Instructions"></aside>
  </div>
  <footer class="status statusbar"><span id="status">No project open</span><span id="app-ver" class="dim small" title="The version of this program"></span><button class="link" id="upd-chip" hidden title="A newer version is available: open the Updates card">Update available</button><button class="link" id="mem-btn" aria-haspopup="dialog" aria-expanded="false" title="Where the graphics memory and the RAM went; free what this program holds">Memory</button></footer>
  <div id="mem-pop" class="mem-pop" role="dialog" aria-label="Memory" hidden></div>
  <script src="app.js"></script>
</body>
</html>
